name: Faren Pullback Intraday Monitor

# 法人撈底盤中拉回進場監控（2026-11-11 由 30K scanner 覆寫改版）。
# 原 30K MACD scanner 已封存（程式碼見 scanner_30k_original.py，
# 完整原版在 backup/30k-original 分支）。本 workflow 只做法人，
# 不動 quant（E3a）與五大選股的 TG 線。
#
# 排程：每 5 分鐘一輪，週一至週五 UTC 00:00-05:59
#      （= 台北 08:00-13:59；程式內 in_window 再限 08:50-13:45，
#       時段外靜默退出）。觸發（現價 <= 進場價）才推 TG，沒觸發靜默。
# 去重：同一檔同一天只推一次（faren_notified.json，跑完 commit 回 repo）。

on:
  schedule:
    - cron: '*/5 0-5 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '乾跑（不推 TG，只印訊息）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: faren-monitor-group
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  faren_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run Faren Monitor (one shot)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAREN_REPORT_TOKEN: ${{ secrets.FAREN_REPORT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scanner.py

      - name: Save Faren Pool and Notify State
        if: always()
        run: |
          git config user.name "faren-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add faren_pool.json faren_notified.json
          if ! git diff --staged --quiet; then
            git commit -m "Update faren pool / notify state [skip ci]"
            git pull --rebase -X theirs origin main || true
            git push origin HEAD:main || true
          fi
